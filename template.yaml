# Proposed AWS deployment: API Gateway, a Python Lambda function and CloudFront.
# CI validates/builds this template; resources are created only by a deployment.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Public OpenText article converter with CloudFront delivery
Resources:
  # HTTP entry point with request-rate and burst throttling.
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
  # Package the application from the project root; Mangum handles Lambda events.
  Converter:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: app.main.handler
      CodeUri: .
      MemorySize: 512
      Timeout: 25
      Policies:
        # Allow the function to write execution logs to CloudWatch.
        - AWSLambdaBasicExecutionRole
      Events:
        # Route both the homepage and nested API/UI paths to FastAPI.
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY
  # Honor origin cache headers with a maximum shared-cache lifetime of 300 seconds.
  # A zero minimum TTL allows no-store responses to remain uncached.
  PublicCache:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-public-articles'
        DefaultTTL: 0
        MinTTL: 0
        MaxTTL: 300
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          # Public article content is keyed by path, without user-specific inputs.
          CookiesConfig: {CookieBehavior: none}
          HeadersConfig: {HeaderBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: none}
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        # Avoid CloudFront's default error-cache delay for these response codes.
        CustomErrorResponses:
          - ErrorCode: 403
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ErrorCachingMinTTL: 0
          - ErrorCode: 500
            ErrorCachingMinTTL: 0
          - ErrorCode: 502
            ErrorCachingMinTTL: 0
          - ErrorCode: 503
            ErrorCachingMinTTL: 0
          - ErrorCode: 504
            ErrorCachingMinTTL: 0
        # Read methods only: CDN requests cannot POST HTML imports.
        # The default path policy is AWS's managed CachingDisabled policy.
        DefaultCacheBehavior:
          TargetOriginId: api
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
        # Only article paths use the custom cache; the API supplies cache headers.
        CacheBehaviors:
          - PathPattern: /api/articles/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref PublicCache
        # Use HTTPS to reach API Gateway. The origin is still publicly reachable;
        # import authorization is enforced by the application, not this CDN.
        Origins:
          - Id: api
            DomainName: !Sub '${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
Outputs:
  Website:
    # Available after deployment; declaring this output does not deploy the site.
    Value: !Sub 'https://${Distribution.DomainName}'
